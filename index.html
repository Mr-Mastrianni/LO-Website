		rel="stylesheet">
	<script>
		// Handle SPA redirects from 404.html for GitHub Pages
		(function () {
			const params = new URLSearchParams(window.location.search);
			const redirect = params.get('redirect');
			if (redirect && !redirect.includes('redirect=')) {
				// Only process if this isn't already a nested redirect
				const decodedPath = decodeURIComponent(redirect);
				// Clean path - remove any /LO-Website prefix if present
				const cleanPath = decodedPath.replace(/^\/LO-Website/, '');
				window.history.replaceState(null, '', cleanPath || '/');
			} else if (redirect && redirect.includes('redirect=')) {
				// If we have nested redirects, just go to home
				window.history.replaceState(null, '', '/');
			}
		})();
	</script>
</head>
