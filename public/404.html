<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // This is a SPA redirect for GitHub Pages with custom domain
    // It takes the current URL and converts it to a redirect to index.html
    // with the path stored in a query parameter
    const path = window.location.pathname + window.location.search + window.location.hash;
    window.location.replace('/?redirect=' + encodeURIComponent(path));
  </script>
</head>

<body>
  <p>Redirecting...</p>
</body>

</html>
